name: Deploy YARD to Timeweb
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish a static release or restore the previous one
        required: true
        type: choice
        default: deploy
        options: [deploy, rollback]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: timeweb-preview
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.TIMEWEB_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: timeweb-preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-11-06
        with:
          persist-credentials: false
      - name: Validate release and PHP
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          find cms server -name '*.php' -print0 | xargs -0 -r -n1 php -l
          python3 scripts/build_release.py --output dist --release "$GITHUB_SHA"
          python3 -c 'import pathlib,re; s=pathlib.Path("dist/index.html").read_text(); pathlib.Path("/tmp/yard-client.js").write_text(re.findall(r"<script>(.*?)</script>",s,re.S)[0])'
          node --check /tmp/yard-client.js
      - name: Publish static design through certificate-verified FTPS
        env:
          FTP_HOST: ${{ secrets.TIMEWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.TIMEWEB_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          DEPLOY_OPERATION: ${{ inputs.operation || 'deploy' }}
        run: python3 scripts/deploy_timeweb.py --directory dist --operation "$DEPLOY_OPERATION"
