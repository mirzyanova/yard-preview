function bindSlideshow(root,images,autoplay){

function oneProject(p){
var next=projects[(p.id+1)%projects.length];
app.innerHTML='<article><header class="project-heading"><a class="back" href="#/projects">← Все проекты</a><h1>'+p.name+'</h1><div class="meta">'+p.stage+' · '+p.year+'</div></header><section class="gallery" aria-label="Галерея изображений"><img class="gallery-photo" src="'+p.gallery[0]+'" alt="Демонстрационное фото, не проект ЯРД">'+controls()+'<div class="gallery-count">01 / 03</div></section><section class="detail"><div class="detail-label">О ПРОЕКТЕ</div><p>Демонстрационное описание. Здесь будет текст о замысле проекта, особенностях места и предложенных архитектурных решениях. В окончательной версии владелец бюро сможет редактировать его через административную панель.</p></section><a class="next-project" href="#/projects/'+next.id+'"><div><small>СЛЕДУЮЩИЙ ПРОЕКТ</small><strong>'+next.name+'</strong></div><span class="next-arrow">↗</span></a></article>';
bindSlideshow(app.querySelector(".gallery"),p.gallery,false)
}
function privacy(){app.innerHTML='<section class="privacy"><h1>Cookie и конфиденциальность</h1><p>Это тестовая версия сайта ЯРД. Здесь нет рекламных или аналитических cookie. Чтобы не показывать уведомление повторно, мы сохраняем ваш выбор в памяти браузера (localStorage). При запуске полноценного сайта информация будет дополнена с учётом фактически подключённых сервисов.</p><p><a class="text-link" href="#/">← На главную</a></p></section>'}
function contacts(){app.innerHTML='<section class="contacts"><div class="eyebrow">ЯРД / СВЯЗЬ</div><h1>Контакты</h1><div class="contact-grid"><div><small>НАПИШИТЕ НАМ</small><a class="email" href="mailto:yard.bureau@mail.ru">yard.bureau@mail.ru</a></div><div><small>БЮРО</small><p>Москва<br>Руководитель — Роман Зимин</p></div></div></section>'}
function route(){clearEvents();clearEvents=function(){};var r=decodeURIComponent((location.hash||"#/").slice(1))||"/";setActive(r);if(r==="/"||r==="/about"){home()}else if(r==="/projects"){allProjects()}else if(r==="/contacts"){contacts()}else if(r==="/privacy"){privacy()}else if(/^\/projects\/\d+$/.test(r)){var p=projects[Number(r.split("/")[2])];if(p)oneProject(p);else allProjects()}else home();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);route();
var cb=document.getElementById("cookieBanner");
try{if(localStorage.getItem("yard-cookie-notice-closed")!=="1") cb.hidden=false;}catch(e){cb.hidden=false}
cb.querySelector("button").addEventListener("click",function(){cb.hidden=true;try{localStorage.setItem("yard-cookie-notice-closed","1")}catch(e){}})
})();
</script>
</body>
</html>
