/* Brand guidelines: Sitka titles, Century Gothic body. Exact font files require licensing. */
:root{--font:"Century Gothic","CenturyGothic",Arial,sans-serif}
.logo{display:inline-flex;align-items:center;gap:11px;font-family:"Sitka Display","Sitka Text",Cambria,Georgia,serif;font-weight:400;font-size:28px;letter-spacing:.01em}
.logo svg{display:block;width:29px;height:36px;flex:none}
.word,.section-heading h1,.project-heading h1,.contacts h1,.next-project strong{font-family:"Sitka Display","Sitka Text",Cambria,Georgia,serif;font-weight:400;letter-spacing:-.035em}
.word{font-size:clamp(105px,12vw,185px)}
.intro-text,.detail p{letter-spacing:0}
.section-heading{width:min(1080px,calc(100% - 26vw));max-width:none;padding:70px 0 54px}
.section-heading .eyebrow{display:none}
.section-heading h1{font-size:clamp(29px,2.5vw,38px);line-height:1.2;margin:0;letter-spacing:-.02em}
.mosaic{width:min(1080px,calc(100% - 26vw));max-width:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:clamp(30px,3.2vw,58px);row-gap:clamp(95px,9vw,155px);align-items:start}
.mosaic-row{display:contents}
.mosaic .tile,.mosaic-row:nth-child(2n) .tile:first-child,.mosaic-row:nth-child(2n+1) .tile:nth-child(2){width:100%;justify-self:auto;aspect-ratio:1.04}
.mosaic .tile:nth-child(2){aspect-ratio:.92}
.mosaic .tile:hover img{transform:scale(1.018)}
.mosaic .tile-info strong{font-family:"Sitka Text",Cambria,Georgia,serif;letter-spacing:0}
.cookie-banner{position:fixed;left:22px;bottom:22px;z-index:99;width:min(455px,calc(100vw - 44px));background:#fff;color:#161616;border:1px solid #d7d7d7;box-shadow:0 7px 24px rgba(0,0,0,.06);padding:20px 50px 20px 22px;font-size:12px;line-height:1.65}
.cookie-banner[hidden]{display:none}
.cookie-banner a{text-decoration:underline;text-underline-offset:3px}
.cookie-close{border:0;background:transparent;color:#333;position:absolute;right:13px;top:10px;font:300 27px/1 Arial,sans-serif;cursor:pointer;padding:3px 7px}
.privacy{max-width:950px;min-height:65svh;margin:auto;padding:110px 25px}
.privacy h1{font:400 clamp(34px,4vw,55px) "Sitka Text",Cambria,Georgia,serif;margin:0 0 50px}
.privacy p{font-size:17px;line-height:1.7;max-width:670px}

@media(max-width:440px){.mosaic{grid-template-columns:1fr;width:calc(100% - 70px);gap:55px}.mosaic .tile:nth-child(2){width:87%;justify-self:end;aspect-ratio:1.08}.section-heading{width:calc(100% - 70px)}.cookie-banner{left:12px;bottom:12px;width:calc(100vw - 24px);padding:16px 45px 16px 16px}}

/* Navigation controls appear only within the outer quarter of each image. */
.control-zone{padding:0;display:block;pointer-events:none}
.control-zone .arrow-zone{appearance:none;display:flex;align-items:center;position:absolute;top:0;bottom:0;width:25%;border:0;background:transparent;color:#111;padding:0;z-index:5;cursor:pointer;pointer-events:auto}
.control-zone .prev{left:0;justify-content:flex-start;padding-left:clamp(12px,2.5vw,45px)}
.control-zone .next{right:0;justify-content:flex-end;padding-right:clamp(12px,2.5vw,45px)}
.control-zone .arrow{pointer-events:none}
.hero .control-zone .arrow,.gallery .control-zone .arrow{opacity:0}
.hero .control-zone .arrow-zone:hover .arrow,.gallery .control-zone .arrow-zone:hover .arrow,
.hero .control-zone .arrow-zone:focus-visible .arrow,.gallery .control-zone .arrow-zone:focus-visible .arrow{opacity:1}
@media(max-width:600px){.control-zone .arrow-zone{width:23%}}
@media(hover:none){.hero .control-zone .arrow,.gallery .control-zone .arrow{opacity:1}}

/* Two views for the project portfolio — grid and an editorial, hover-preview list. */
.projects-page-heading{display:flex;align-items:center;justify-content:space-between;gap:30px}
.projects-page-heading h1{margin:0}
.projects-view-switch{display:flex;align-items:center;gap:30px;font-size:16px}
.projects-view-switch .view-tab{display:inline-flex;align-items:center;gap:9px;color:#999;border-bottom:1px solid transparent;padding:8px 0 11px;white-space:nowrap;transition:color .18s,border-color .18s}
.projects-view-switch .view-tab svg{flex:none}
.projects-view-switch .view-tab.selected,.projects-view-switch .view-tab:hover{color:#151515}
.projects-view-switch .view-tab.selected{border-color:#151515}
.project-list{width:calc(100% - 2 * var(--page));margin:52px var(--page) 160px}
.project-list-head,.project-list-row{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1.15fr) minmax(70px,.25fr);column-gap:26px;align-items:center}

/* YARD portfolio composition: three editorial scales, consistent rails, balanced masonry. */
.mosaic{column-gap:clamp(28px,3.1vw,52px);padding-bottom:clamp(105px,10vw,165px)}
.mosaic .mosaic-column{gap:clamp(44px,5vw,78px)}
.mosaic .mosaic-column .tile{aspect-ratio:auto !important;background:transparent;overflow:visible;flex:0 0 auto}
.mosaic .mosaic-column .tile.size-small{width:80% !important}
.mosaic .mosaic-column .tile.size-medium{width:91% !important}
.mosaic .mosaic-column .tile.size-large{width:100% !important}
.mosaic .tile-visual{display:block;width:100%;height:auto;position:relative;overflow:hidden;transition:transform .36s cubic-bezier(.2,.65,.22,1);transform-origin:center}
.mosaic .tile.format-horizontal .tile-visual{aspect-ratio:1.56}
.mosaic .tile.format-vertical .tile-visual{aspect-ratio:.78}
.mosaic .tile.format-square .tile-visual{aspect-ratio:1}
.mosaic .tile-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:none}
.mosaic .tile:hover .tile-visual,.mosaic .tile:focus-visible .tile-visual{transform:scale(1.018)}
.mosaic .tile:hover img{transform:none}
.mosaic .tile-caption{display:flex;position:static;flex-direction:column;align-items:flex-start;gap:3px;width:100%;min-height:56px;padding-top:11px;color:var(--ink);opacity:0;transform:none;transition:opacity .22s ease;pointer-events:none}
.mosaic .tile:hover .tile-caption,.mosaic .tile:focus-visible .tile-caption{opacity:1;transform:none}
.mosaic .tile-caption strong{font-family:"Sitka Text",Cambria,Georgia,serif;font-size:clamp(13px,1.12vw,16px);font-weight:400;line-height:1.3;letter-spacing:0;max-width:100%;overflow-wrap:break-word}
.mosaic .tile-caption small{font-size:11px;line-height:1.4;color:#777;max-width:100%}
@media(hover:none){.mosaic .tile-caption{opacity:1;transform:none}}
@media(max-width:900px){
 .mosaic{column-gap:clamp(22px,4vw,36px)}
 .mosaic .mosaic-column{gap:clamp(44px,6vw,62px)}
 .mosaic .mosaic-column .tile.size-small{width:85% !important}
 .mosaic .mosaic-column .tile.size-medium{width:94% !important}
 .mosaic .mosaic-column .tile.size-large{width:100% !important}
 .mosaic .tile-caption strong{font-size:14px}
}
@media(max-width:600px){
 .mosaic .mosaic-column{gap:48px}
 .mosaic .mosaic-column .tile.size-small{width:90% !important}

 .mosaic .tile-caption strong{font-size:15px}

}

function showProjectListPreview(){
var rows=app.querySelectorAll('.project-list-row');
var preview=app.querySelector('.project-list-preview');
if(!preview||!rows.length||!window.matchMedia('(hover:hover) and (pointer:fine)').matches)return;
var image=preview.querySelector('img');
image.onerror=function(){this.onerror=null;this.src="assets/erfurt-photo-pending.svg"};
function follow(e){
var width=preview.offsetWidth||155,height=preview.offsetHeight||215;
var x=e.clientX+65,y=e.clientY-height*0.40;
if(x+width>window.innerWidth-18)x=e.clientX-width-24;
if(x<14)x=14;
if(y+height>window.innerHeight-14)y=window.innerHeight-height-14;
if(y<14)y=14;
preview.style.transform='translate3d('+Math.round(x)+'px,'+Math.round(y)+'px,0)';
}
rows.forEach(function(row){
row.addEventListener('pointerenter',function(e){
if(e.pointerType!=='mouse'&&e.pointerType!=='pen')return;
preview.dataset.format=row.dataset.format||'square';
image.style.objectPosition=cardCrop(row.dataset.cropX)+'% '+cardCrop(row.dataset.cropY)+'%';
image.src=row.dataset.preview;
preview.classList.add('visible');
follow(e);
});
row.addEventListener('pointermove',function(e){if(preview.classList.contains('visible'))follow(e)});
row.addEventListener('pointerleave',function(){preview.classList.remove('visible')});
row.addEventListener('blur',function(){preview.classList.remove('visible')});
});
}

function mosaicColumnCount(){return window.innerWidth<=600?1:(window.innerWidth<=900?2:3)}
/* Portfolio scroll entrance follows the same IntersectionObserver approach as the
   homepage blocks, but observes individual project cards so later uploads reveal
   naturally as the visitor reaches them. Hover zoom remains independent. */
/* On arrival the first viewport is already complete. Only cards below it
   rise into view as the visitor scrolls, including new WordPress projects. */
function bindPortfolioScrollRise(){
if(portfolioRevealObserver){portfolioRevealObserver.disconnect();portfolioRevealObserver=null}
var generation=++portfolioRevealGeneration;
var tiles=Array.from(app.querySelectorAll(".yard-index .tile"));
app.classList.remove("portfolio-rise-ready");
if(!tiles.length)return;
if(!("IntersectionObserver" in window)||window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
requestAnimationFrame(function(){
if(generation!==portfolioRevealGeneration||!app.querySelector(".yard-index"))return;
/* Route resets scroll to the top synchronously; measure the initial viewport
   after that reset, before ever enabling the hidden-state CSS. */
var viewportBottom=window.innerHeight||document.documentElement.clientHeight;
tiles.forEach(function(tile){
if(tile.getBoundingClientRect().top<viewportBottom){
tile.classList.add("is-revealed")
}
});
var observer=new IntersectionObserver(function(entries){
entries.forEach(function(entry){
if(entry.isIntersecting){
entry.target.classList.add("is-revealed");
observer.unobserve(entry.target)
}
})
},{threshold:0.12,rootMargin:"0px 0px -7% 0px"});
portfolioRevealObserver=observer;
app.classList.add("portfolio-rise-ready");
tiles.forEach(function(tile){
if(!tile.classList.contains("is-revealed"))observer.observe(tile)
})
})
}
function allProjects(view){
projectView=view||projectView;
if(projectView==='list'){renderProjectList();return}

/* Deterministic three-column composition: a shared top edge, equal column rails,
   varied image formats and a restrained, repeating hierarchy of card widths. */
var rhythm=["large","medium","large","medium","large","medium","small","large","medium"];
function projectCardSize(p,index){return ["small","medium","large"].includes(p.cardSize)?p.cardSize:rhythm[index%rhythm.length]}
var columnCount=mosaicColumnCount();
var columns=Array.from({length:columnCount},function(){return []});
projects.forEach(function(project,index){columns[index%columnCount].push({project:project,index:index})});
var markup=columns.map(function(items,col){
return '<div class="mosaic-column">'+items.map(function(entry){
var p=entry.project,i=entry.index;
var align=columnCount===1?'center':(col===0?'left':(col===columnCount-1?'right':'center'));
var size=projectCardSize(p,i),format=projectCardFormat(p);
var meta=[p.stage,p.year].filter(Boolean).join(' · ');
return '<a class="tile format-'+format+' size-'+size+' align-'+align+'" href="#/projects/'+p.id+'" aria-label="'+p.name+(meta?', '+meta:'')+'">'+
'<span class="tile-visual">'+cardImage(p)+'<span class="tile-caption"><strong>'+p.name+'</strong>'+(meta?'<small>'+meta+'</small>':'')+'</span></span></a>'
}).join('')+'</div>'
}).join('');
app.innerHTML=renderProjectsHeading('grid')+'<section class="mosaic yard-index" aria-label="Все проекты">'+markup+'</section>';
app.dataset.mosaicColumns=String(columnCount);
bindPortfolioScrollRise();
}


function projectInfo(p){
var fields=[['Локация',p.location],['Год',p.year],['Стадия',p.stage]];
var rows=fields.filter(function(item){return item[1]&&item[1]!=='—'&&item[1]!=='-'}).map(function(item){return '<div class="project-fact"><dt>'+item[0]+'</dt><dd>'+item[1]+'</dd></div>'}).join('');
return rows?'<div class="project-story-facts"><dl>'+rows+'</dl></div>':''
}
function projectStory(p){
var facts=projectInfo(p),description=projectDetail(p);
return facts||description?'<section class="project-story" aria-label="О проекте">'+facts+description+'</section>':''
}
function projectGalleryItems(p){
var source=p.galleryItems&&p.galleryItems.length?p.galleryItems:p.gallery.map(function(url){return {url:url,size:'large'}});
var primary=p.pageImage||(source[0]&&source[0].url)||p.image;
var items=primary?[{url:primary,size:'large'}]:[];
var omittedPrimary=false;
source.forEach(function(item){
if(!omittedPrimary&&item.url===primary){omittedPrimary=true;return}
items.push({url:item.url,size:['large','medium','small'].includes(item.size)?item.size:'large'});
});
return items
}
function projectImages(p){
var items=projectGalleryItems(p),count=items.length;
if(!count)return '';
var first=items[0],alt=p.name;
return '<section class="project-gallery" aria-label="Фотографии проекта"><div class="project-gallery-stage" tabindex="0" aria-label="Галерея: листайте стрелками">'+
'<div class="project-gallery-canvas size-'+first.size+'"><img class="project-gallery-image" src="'+first.url+'" alt="'+alt+' — изображение 1" fetchpriority="high" decoding="async"></div>'+
(count>1?'<button type="button" class="project-gallery-arrow project-gallery-prev" aria-label="Предыдущее фото">'+iconSvg("prev")+'</button><button type="button" class="project-gallery-arrow project-gallery-next" aria-label="Следующее фото">'+iconSvg("next")+'</button>':'')+
'</div><div class="project-gallery-navigation">'+
'<div class="project-gallery-thumbs" role="group" aria-label="Выбрать фотографию">'+items.map(function(item,i){
return '<button class="project-gallery-thumb'+(i===0?' active':'')+'" type="button" data-index="'+i+'" aria-label="Фото '+(i+1)+' из '+count+'" aria-pressed="'+(i===0?'true':'false')+'"><img src="'+item.url+'" alt="" loading="lazy" decoding="async"></button>'
}).join('')+'</div><span class="project-gallery-count" aria-live="polite">01 / '+String(count).padStart(2,'0')+'</span></div></section>'
}
function bindProjectGallery(root,items,p){
if(!root||!items.length)return;
var current=0,display=root.querySelector('.project-gallery-image'),canvas=root.querySelector('.project-gallery-canvas');
var thumbs=Array.from(root.querySelectorAll('.project-gallery-thumb'));
var count=root.querySelector('.project-gallery-count');
var stage=root.querySelector('.project-gallery-stage');
function show(index){
current=(index+items.length)%items.length;
var item=items[current];canvas.className='project-gallery-canvas size-'+item.size;
if(display.getAttribute('src')!==item.url){display.src=item.url}
display.alt=p.name+' — изображение '+(current+1);
count.textContent=String(current+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0');
thumbs.forEach(function(btn,i){var active=i===current;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))});
var selected=thumbs[current],scroller=root.querySelector('.project-gallery-thumbs');
if(selected&&scroller){
var left=selected.offsetLeft-scroller.offsetLeft;
if(left<scroller.scrollLeft){scroller.scrollLeft=left}
else if(left+selected.offsetWidth>scroller.scrollLeft+scroller.clientWidth){scroller.scrollLeft=left+selected.offsetWidth-scroller.clientWidth}
}
}
var prev=root.querySelector('.project-gallery-prev'),next=root.querySelector('.project-gallery-next');
if(prev)prev.onclick=function(){show(current-1)};
if(next)next.onclick=function(){show(current+1)};
root.addEventListener('click',function(event){
var btn=event.target.closest('.project-gallery-thumb');
if(btn&&root.contains(btn))show(Number(btn.dataset.index))
});
root.addEventListener('keydown',function(event){
if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();show(current+(event.key==='ArrowRight'?1:-1))}
});
var initialX=0,initialY=0;
stage.addEventListener('touchstart',function(event){if(event.changedTouches.length){initialX=event.changedTouches[0].screenX;initialY=event.changedTouches[0].screenY}},{passive:true});
stage.addEventListener('touchend',function(event){
if(!event.changedTouches.length)return;
var dx=event.changedTouches[0].screenX-initialX,dy=event.changedTouches[0].screenY-initialY;
if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)show(current+(dx>0?-1:1))
},{passive:true});
}

}

function route(){portfolioRevealGeneration++;if(portfolioRevealObserver){portfolioRevealObserver.disconnect();portfolioRevealObserver=null}app.classList.remove("portfolio-rise-ready");clearEvents();clearEvents=function(){};var r=decodeURIComponent((location.hash||"#/").slice(1))||"/";setActive(r);document.body.classList.toggle("yard-home-route",r==="/"||r==="/about");if(r==="/"||r==="/about"){home()}else if(r==="/projects"||r.indexOf("/projects?")===0){var selectedView=/[?&]view=list(?:&|$)/.test(r)?"list":(/[?&]view=grid(?:&|$)/.test(r)?"grid":projectView);allProjects(selectedView)}else if(r==="/contacts"){contacts()}else if(r==="/privacy"){privacy()}else if(/^\/projects\/\d+$/.test(r)){var p=projects[Number(r.split("/")[2])];if(p)oneProject(p);else allProjects()}else home();window.scrollTo(0,0);requestHeaderContrast();if(r==="/about")requestAnimationFrame(function(){var target=document.getElementById("about");if(target)target.scrollIntoView({behavior:"smooth",block:"start"})})}
window.addEventListener("resize",function(){var r=decodeURIComponent((location.hash||"#/").slice(1))||"/";if((r==="/projects"||r.indexOf("/projects?")===0)&&projectView==="grid"&&app.dataset.mosaicColumns!==String(mosaicColumnCount()))allProjects("grid")});
window.addEventListener("hashchange",route);route();
var cb=document.getElementById("cookieBanner");
cb.hidden=false;
cb.querySelector("button").addEventListener("click",function(){cb.hidden=true})
})();
