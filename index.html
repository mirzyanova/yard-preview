/* Brand guidelines: Sitka titles, Century Gothic body. Exact font files require licensing. */
:root{--font:"Century Gothic","CenturyGothic",Arial,sans-serif}
.logo{display:inline-flex;align-items:center;gap:11px;font-family:"Sitka Display","Sitka Text",Cambria,Georgia,serif;font-weight:400;font-size:28px;letter-spacing:.01em}
.logo svg{display:block;width:29px;height:36px;flex:none}
.word,.section-heading h1,.project-heading h1,.contacts h1,.next-project strong{font-family:"Sitka Display","Sitka Text",Cambria,Georgia,serif;font-weight:400;letter-spacing:-.035em}
.word{font-size:clamp(105px,12vw,185px)}
.intro-text,.detail p{letter-spacing:0}
.section-heading{width:min(1080px,calc(100% - 26vw));max-width:none;padding:70px 0 54px}
.section-heading .eyebrow{display:none}
.section-heading h1{font-size:clamp(29px,2.5vw,38px);line-height:1.2;margin:0;letter-spacing:-.02em}
.mosaic{width:min(1080px,calc(100% - 26vw));max-width:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:clamp(30px,3.2vw,58px);row-gap:clamp(95px,9vw,155px);align-items:start}
.mosaic-row{display:contents}
.mosaic .tile,.mosaic-row:nth-child(2n) .tile:first-child,.mosaic-row:nth-child(2n+1) .tile:nth-child(2){width:100%;justify-self:auto;aspect-ratio:1.04}
.mosaic .tile:nth-child(2){aspect-ratio:.92}
.mosaic .tile:hover img{transform:scale(1.018)}
.mosaic .tile-info strong{font-family:"Sitka Text",Cambria,Georgia,serif;letter-spacing:0}
.cookie-banner{position:fixed;left:22px;bottom:22px;z-index:99;width:min(455px,calc(100vw - 44px));background:#fff;color:#161616;border:1px solid #d7d7d7;box-shadow:0 7px 24px rgba(0,0,0,.06);padding:20px 50px 20px 22px;font-size:12px;line-height:1.65}
.cookie-banner[hidden]{display:none}
.cookie-banner a{text-decoration:underline;text-underline-offset:3px}
.cookie-close{border:0;background:transparent;color:#333;position:absolute;right:13px;top:10px;font:300 27px/1 Arial,sans-serif;cursor:pointer;padding:3px 7px}
.privacy{max-width:950px;min-height:65svh;margin:auto;padding:110px 25px}
.privacy h1{font:400 clamp(34px,4vw,55px) "Sitka Text",Cambria,Georgia,serif;margin:0 0 50px}
.privacy p{font-size:17px;line-height:1.7;max-width:670px}

.control-zone .arrow-zone{appearance:none;display:flex;align-items:center;position:absolute;top:0;bottom:0;width:25%;border:0;background:transparent;color:#111;padding:0;z-index:5;cursor:pointer;pointer-events:auto}

.control-zone .next{right:0;justify-content:flex-end;padding-right:clamp(12px,2.5vw,45px)}
.control-zone .arrow{pointer-events:none}
.hero .control-zone .arrow,.gallery .control-zone .arrow{opacity:0}
.hero .control-zone .arrow-zone:hover .arrow,.gallery .control-zone .arrow-zone:hover .arrow,
.hero .control-zone .arrow-zone:focus-visible .arrow,.gallery .control-zone .arrow-zone:focus-visible .arrow{opacity:1}

.projects-view-switch .view-tab.selected,.projects-view-switch .view-tab:hover{color:#151515}
.projects-view-switch .view-tab.selected{border-color:#151515}

<body>
<header class="site-header"><a class="logo" href="#/" aria-label="ЯРД, главная">ЯРД</a><nav class="nav" aria-label="Главное меню"><a href="#/about" data-page="about">О нас</a><a href="#/projects" data-page="projects">Проекты</a><a href="#/contacts" data-page="contacts">Контакты</a></nav></header>
<main id="app"></main>
<footer class="footer"><span>© ЯРД · 2026</span><span>Архитектурное бюро · Москва</span></footer>
<div class="cookie-banner" id="cookieBanner" role="region" aria-label="Информация о cookie" hidden>Это тестовая версия сайта. Рекламные и аналитические cookie не используются. <a href="#/privacy">Подробнее</a><button class="cookie-close" type="button" aria-label="Закрыть уведомление">×</button></div>
<div class="preview-tag">ЭСКИЗ · ПОРТФОЛИО ПОСТЕПЕННО ЗАПОЛНЯЕТСЯ</div>
<script>
(function(){
"use strict";
var photos=[
"https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=1800&q=85",
"https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=1800&q=85",
"https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=1800&q=85",
"https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1800&q=85",
"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1800&q=85",
"https://images.unsplash.com/photo-1486718448742-163732cd1544?auto=format&fit=crop&w=1800&q=85",
"https://images.unsplash.com/photo-1515263487990-61b07816b324?auto=format&fit=crop&w=1800&q=85",
"https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&w=1800&q=85"
];
var stages=["Концепция","Проект","Реализация","Концепция","Проект","Рабочая документация","Проект","Реализация"];
var years=["2026","2025","2024","2025","2023","2024","2026","2022"];
var projects=photos.map(function(url,i){return {id:i,name:"Проект "+String(i+1).padStart(2,"0"),year:years[i],stage:stages[i],location:"—",image:url,gallery:[url,photos[(i+3)%8],photos[(i+5)%8]]}});
/* First real portfolio project. All three photographs are stored in this repository. */
projects[0]={id:0,name:"Арт-объект ERFURT на бульваре ЗИЛАРТ",stage:"Реализация",year:"2024",location:"Москва, Россия",image:"erfurt-01.webp",gallery:["erfurt-01.webp","erfurt-02.webp","erfurt-03.webp"],description:""};
var app=document.getElementById("app"), timer=null, clearEvents=function(){}, projectView="grid";
function page(id){window.location.hash="#/"+id}
function img(url,alt){var missing=url.indexOf("erfurt-")===0?' onerror="this.onerror=null;this.src=\'assets/erfurt-photo-pending.svg\'"':'';return '<img src="'+url+'" alt="'+alt+'" loading="lazy"'+missing+'>'}
function controls(){return '<div class="control-zone"><button class="arrow-zone prev" type="button" aria-label="Предыдущее изображение"><span class="arrow" aria-hidden="true">‹</span></button><button class="arrow-zone next" type="button" aria-label="Следующее изображение"><span class="arrow" aria-hidden="true">›</span></button></div>'}
function setActive(route){document.querySelectorAll(".nav a").forEach(function(a){var k=a.getAttribute("data-page");a.classList.toggle("active", k==="about"&&(route==="/"||route==="/about")||k==="projects"&&route.indexOf("/projects")===0||k==="contacts"&&route==="/contacts")})}
function bindSlideshow(root,images,autoplay){
var index=0, photo=root.querySelector(".gallery-photo"), slides=root.querySelectorAll(".hero-slide"), count=root.querySelector(".counter,.gallery-count");
function show(n){index=(n+images.length)%images.length;if(photo){photo.onerror=function(){if(this.getAttribute("src")!=="assets/erfurt-photo-pending.svg")this.src="assets/erfurt-photo-pending.svg"};photo.src=images[index]}if(slides.length){slides.forEach(function(el,i){el.classList.toggle("active",i===index);el.setAttribute("aria-hidden",String(i!==index))})}if(count)count.textContent=String(index+1).padStart(2,"0")+" / "+String(images.length).padStart(2,"0")}
function stop(){if(timer){clearInterval(timer);timer=null}}
function start(){if(autoplay&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches){stop();timer=setInterval(function(){show(index+1)},6500)}}
root.querySelector(".prev").onclick=function(){show(index-1);start()};
root.querySelector(".next").onclick=function(){show(index+1);start()};
root.onmouseenter=stop;root.onmouseleave=start;
var sx=0;root.ontouchstart=function(e){sx=e.changedTouches[0].screenX};root.ontouchend=function(e){var dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>55){show(index+(dx>0?-1:1));start()}};
start();clearEvents=stop;
}
function home(){
var selected=projects.slice(0,4);
app.innerHTML='<section class="intro" id="about"><div class="intro-brand"><div class="eyebrow brand-eyebrow">Архитектурное бюро. Москва</div><img class="home-logo" src="assets/yard-logo-horizontal.svg" alt="ЯРД — Архитектурное бюро"><p class="word-note">Yard (ja:d) Ярд — Двор, площадка, сад, парк.<br>Данное слово объединяет в себе совокупность пространств, с которыми чаще всего сталкивается ландшафтный архитектор в своей практике.</p></div><div class="intro-text"><p>Продвигаем идею осмысленной ландшафтной архитектуры, являющейся по своему характеру монументальной, знаковой, оставляющей заметный след в сфере</p><a class="text-link" href="#/projects">Смотреть проекты ↗</a></div></section><section class="hero" aria-label="Избранные проекты">'+selected.map(function(p,i){return '<div class="hero-slide'+(i===0?' active':'')+'" aria-hidden="'+(i!==0)+'"><a href="#/projects/'+p.id+'">'+img(p.image,p.id===0?'Арт-объект ERFURT на бульваре ЗИЛАРТ':'Демонстрационное фото, не проект ЯРД')+'<div class="hero-caption"><strong>'+p.name+'</strong><span>'+p.stage+' · '+p.year+'</span></div></a></div>'}).join("")+controls()+'<div class="counter">01 / 04</div></section><section class="closing"><div class="closing-content"><h2>Новый взгляд на проект</h2><p>Главной ценностью ландшафтного бюро в процессе проектирования является формирование такого материала, который ёмко и полно описывает все качества проектируемого объекта в соответствии с принципами классовости и технологичности благоустройства.</p><p>Полнота проекта - есть важный критерий для достижения качественной реализации в полном соответствии с задумкой автора, действующего согласно с экономической моделью заказчика.</p><p>Проект является средством коммуникации или, даже можно сказать, языком, на котором говорит архитектор с остальными участниками проектирования. Наша цель - совершенствовать данный язык.</p></div><a class="text-link" href="#/projects">Все проекты ↗</a></section>'+
'<section class="yard-facts" aria-labelledby="yard-facts-title"><h2 id="yard-facts-title">ЯРД в цифрах</h2><div class="yard-facts-grid"><div class="yard-fact"><strong>13</strong><span>Лет опыта</span></div><div class="yard-fact"><strong>8</strong><span>Городов</span></div><div class="yard-fact"><strong>2</strong><span>Страны в портфолио</span></div></div></section>';
bindSlideshow(app.querySelector(".hero"),selected.map(function(p){return p.image}),true)
}
function projectViewSwitch(view){
var gridIcon='<svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true" fill="currentColor"><rect x="1" y="1" width="5" height="5"/><rect x="7.5" y="1" width="5" height="5"/><rect x="14" y="1" width="5" height="5"/><rect x="1" y="7.5" width="5" height="5"/><rect x="7.5" y="7.5" width="5" height="5"/><rect x="14" y="7.5" width="5" height="5"/><rect x="1" y="14" width="5" height="5"/><rect x="7.5" y="14" width="5" height="5"/><rect x="14" y="14" width="5" height="5"/></svg>';
var listIcon='<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="currentColor"><rect x="1" y="2" width="4" height="4"/><rect x="7.5" y="3" width="11.5" height="2"/><rect x="1" y="8" width="4" height="4"/><rect x="7.5" y="9" width="11.5" height="2"/><rect x="1" y="14" width="4" height="4"/><rect x="7.5" y="15" width="11.5" height="2"/></svg>';
return '<nav class="projects-view-switch" aria-label="Отображение проектов"><a class="view-tab'+(view==='grid'?' selected':'')+'" href="#/projects?view=grid" aria-label="Сетка" title="Сетка"'+(view==='grid'?' aria-current="page"':'')+'>'+gridIcon+'</a><a class="view-tab'+(view==='list'?' selected':'')+'" href="#/projects?view=list" aria-label="Список" title="Список"'+(view==='list'?' aria-current="page"':'')+'>'+listIcon+'</a></nav>'
}
function renderProjectsHeading(view){
return '<header class="section-heading projects-page-heading"><h1>Проекты</h1>'+projectViewSwitch(view)+'</header>'
}
function showProjectListPreview(){
var rows=app.querySelectorAll('.project-list-row');
var preview=app.querySelector('.project-list-preview');
if(!preview||!rows.length||!window.matchMedia('(hover:hover) and (pointer:fine)').matches)return;
var image=preview.querySelector('img');
image.onerror=function(){this.onerror=null;this.src="assets/erfurt-photo-pending.svg"};
function follow(e){
var width=preview.offsetWidth||155,height=preview.offsetHeight||215;
var x=e.clientX+65,y=e.clientY-height*0.40;
if(x+width>window.innerWidth-18)x=e.clientX-width-24;
if(x<14)x=14;
if(y+height>window.innerHeight-14)y=window.innerHeight-height-14;
if(y<14)y=14;
preview.style.transform='translate3d('+Math.round(x)+'px,'+Math.round(y)+'px,0)';
}
rows.forEach(function(row){
row.addEventListener('pointerenter',function(e){
if(e.pointerType!=='mouse'&&e.pointerType!=='pen')return;
image.src=row.dataset.preview;
preview.classList.add('visible');
follow(e);
});
row.addEventListener('pointermove',function(e){if(preview.classList.contains('visible'))follow(e)});
row.addEventListener('pointerleave',function(){preview.classList.remove('visible')});
row.addEventListener('blur',function(){preview.classList.remove('visible')});
});
}
function renderProjectList(){
var rows=projects.map(function(p){
return '<a class="project-list-row" href="#/projects/'+p.id+'" data-preview="'+p.image+'" aria-label="'+p.name+', '+p.stage+', '+p.year+', локация: '+(p.location||'—')+'"><span class="list-project-name">'+p.name+'</span><span class="list-project-stage">'+p.stage+'</span><span class="list-project-year">'+p.year+'</span><span class="list-project-location">'+(p.location||'—')+'</span></a>'

'<section class="project-list" aria-label="Проекты списком"><div class="project-list-head" aria-hidden="true"><span>Проект</span><span>Стадия</span><span>Год</span><span>Локация</span></div><div class="project-list-body">'+rows+'</div></section>'+

}
function mosaicColumnCount(){return window.innerWidth<=600?1:(window.innerWidth<=900?2:3)}
function allProjects(view){
projectView=view||projectView;
if(projectView==='list'){renderProjectList();return}

var formats=["horizontal","vertical","square","vertical","horizontal","square","square","horizontal"];
var sizes=["large","small","medium","small","large","medium","medium","large"];
var columnCount=mosaicColumnCount();
var columns=[];for(var c=0;c<columnCount;c++)columns.push([]);
projects.forEach(function(p,i){columns[i%columnCount].push(p)});
app.innerHTML=renderProjectsHeading('grid')+'<section class="mosaic" aria-label="Все проекты">'+columns.map(function(items,col){return '<div class="mosaic-row mosaic-column">'+items.map(function(p){var index=p.id, position=columnCount===1?"left":(columnCount===2?["left","right"][col]:["left","center","right"][col]);return '<a class="tile format-'+formats[index]+' size-'+sizes[index]+' align-'+position+'" href="#/projects/'+p.id+'" aria-label="'+p.name+', '+p.stage+', '+p.year+'">'+img(p.image,p.id===0?'Арт-объект ERFURT на бульваре ЗИЛАРТ':'Демонстрационное фото, не проект ЯРД')+'<div class="tile-info"><strong>'+p.name+'</strong><small>'+p.stage+' · '+p.year+'</small></div></a>'}).join("")+'</div>'}).join("")+'</section>';
app.dataset.mosaicColumns=String(columnCount)
}
function oneProject(p){
var next=projects[(p.id+1)%projects.length];
app.innerHTML='<article><header class="project-heading"><a class="back" href="#/projects">← Все проекты</a><h1>'+p.name+'</h1><div class="meta">'+p.stage+' · '+p.year+'</div></header><section class="gallery" aria-label="Галерея изображений"><img class="gallery-photo" src="'+p.gallery[0]+'" alt="'+(p.id===0?'Арт-объект ERFURT':'Демонстрационное фото, не проект ЯРД')+'">'+controls()+'<div class="gallery-count">01 / '+String(p.gallery.length).padStart(2,"0")+'</div></section>'+(p.id===0?'':'<section class="detail"><div class="detail-label">О ПРОЕКТЕ</div><p>Демонстрационное описание. Здесь будет текст о замысле проекта, особенностях места и предложенных архитектурных решениях. В окончательной версии владелец бюро сможет редактировать его через административную панель.</p></section>')+'<a class="next-project" href="#/projects/'+next.id+'"><div><small>СЛЕДУЮЩИЙ ПРОЕКТ</small><strong>'+next.name+'</strong></div><span class="next-arrow">↗</span></a></article>';
bindSlideshow(app.querySelector(".gallery"),p.gallery,false)
}
function privacy(){app.innerHTML='<section class="privacy"><h1>Cookie и конфиденциальность</h1><p>Это тестовая версия сайта ЯРД. Здесь нет рекламных или аналитических cookie. Уведомление появляется при каждом новом открытии сайта и не сохраняет отметку о закрытии. При запуске полноценного сайта информация будет дополнена с учётом фактически подключённых сервисов.</p><p><a class="text-link" href="#/">← На главную</a></p></section>'}
function contacts(){app.innerHTML='<section class="contacts"><div class="contacts-heading"><h1>Контакты</h1><img class="contacts-logo" src="assets/yard-logo-horizontal.svg" alt="ЯРД — Архитектурное бюро"><p class="contacts-city">г. Москва</p></div><div class="contact-grid"><div><small>НАПИШИТЕ НАМ</small><a class="email" href="mailto:yard.bureau@mail.ru">yard.bureau@mail.ru</a></div><div><small>Руководитель бюро</small><p class="manager-name">Роман Зимин</p></div></div></section>'}
function route(){clearEvents();clearEvents=function(){};var r=decodeURIComponent((location.hash||"#/").slice(1))||"/";setActive(r);if(r==="/"||r==="/about"){home()}else if(r==="/projects"||r.indexOf("/projects?")===0){var selectedView=/[?&]view=list(?:&|$)/.test(r)?"list":(/[?&]view=grid(?:&|$)/.test(r)?"grid":projectView);allProjects(selectedView)}else if(r==="/contacts"){contacts()}else if(r==="/privacy"){privacy()}else if(/^\/projects\/\d+$/.test(r)){var p=projects[Number(r.split("/")[2])];if(p)oneProject(p);else allProjects()}else home();window.scrollTo(0,0)}
window.addEventListener("resize",function(){var r=decodeURIComponent((location.hash||"#/").slice(1))||"/";if((r==="/projects"||r.indexOf("/projects?")===0)&&projectView==="grid"&&app.dataset.mosaicColumns!==String(mosaicColumnCount()))allProjects("grid")});
window.addEventListener("hashchange",route);route();
var cb=document.getElementById("cookieBanner");
cb.hidden=false;
cb.querySelector("button").addEventListener("click",function(){cb.hidden=true})
})();
</script>
</body>
</html>
